<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Signal Lost</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="terminal-shell" style="display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;">
    <div>
        <p style="font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--amber-core);margin-bottom:var(--space-md);">// Error 404</p>
        <h1 style="font-family:var(--font-serif);font-size:clamp(2.5rem,6vw,4rem);color:var(--text-primary);margin-bottom:var(--space-md);">Signal <em style="color:var(--amber-bright);font-style:italic;">Lost</em></h1>
        <p style="font-size:14px;color:var(--text-secondary);margin-bottom:var(--space-xl);max-width:360px;line-height:1.7;">The requested frequency could not be located. Returning to base.</p>
        <a href="/" style="display:inline-flex;align-items:center;gap:var(--space-sm);font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--amber-core);border:1px solid var(--carbon-line);padding:12px 24px;transition:all 180ms ease;">← Return to Signal</a>
    </div>
</div>
</body>
</html>
